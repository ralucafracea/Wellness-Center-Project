<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Admin - Tirra Wellness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="padding: 30px;">

    <h1>Panou Administrare</h1>
    <a href="../index.html" class="btn btn-secondary mb-4">Înapoi la Site</a>

    <hr>

    <h2>Adaugă Serviciu Nou</h2>
    <form id="form-adaugare" style="max-width: 400px; margin-bottom: 50px;">
        
        <label>Nume Serviciu / Pachet:</label>
        <input type="text" id="nume" class="form-control mb-2" required>

        <label>Descriere scurtă:</label>
        <textarea id="descriere" class="form-control mb-2" required></textarea>

        <label>Preț (RON):</label>
        <input type="number" id="pret" class="form-control mb-2" required>

        <label>Categorie:</label>
        <select id="categorie" class="form-control mb-2" required>
            <option value="spa">Spa & Wellness</option>
            <option value="fitness">Fitness</option>
        </select>

        <label>Tip Achiziție:</label>
        <select id="tip_achizitie" class="form-control mb-2" required>
            <option value="programare">Programare (O singură dată)</option>
            <option value="abonament">Abonament (Recurent)</option>
        </select>

        <label>Durată (Minute):</label>
        <input type="number" id="durata_minute" class="form-control mb-2">

        <label>Zile Valabilitate:</label>
        <input type="number" id="zile_valabilitate" class="form-control mb-3">

        <button type="submit" class="btn btn-primary w-100">Adaugă în Baza de Date</button>
    </form>

    <hr>

    <h2>Lista Serviciilor Existente</h2>
    <table class="table table-bordered table-striped" style="max-width: 800px;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nume</th>
                <th>Categorie</th>
                <th>Preț</th>
                <th>Acțiune</th>
            </tr>
        </thead>
        <tbody id="tabel-servicii">
            </tbody>
    </table>

    <script>
        // 1. FUNCȚIA DE ÎNCĂRCARE A DATELOR (GET)
        async function incarcaServicii() {
            try {
                const response = await fetch('http://localhost:3000/api/servicii');
                const servicii = await response.json();
                
                const tabel = document.getElementById('tabel-servicii');
                tabel.innerHTML = ''; // Curățăm tabelul înainte de a pune datele noi

                servicii.forEach(serviciu => {
                    const rand = document.createElement('tr');
                    rand.innerHTML = `
                        <td>${serviciu.id}</td>
                        <td><strong>${serviciu.nume}</strong></td>
                        <td><span class="badge bg-secondary">${serviciu.categorie}</span></td>
                        <td>${serviciu.pret} RON</td>
                        <td><button class="btn btn-danger btn-sm" onclick="stergeServiciu(${serviciu.id})">Șterge</button></td>
                    `;
                    tabel.appendChild(rand);
                });
            } catch (eroare) {
                console.error('Eroare la citire:', eroare);
            }
        }

        // Apelăm funcția când se deschide pagina
        incarcaServicii();

        // 2. FUNCȚIA DE ADĂUGARE (POST)
        document.getElementById('form-adaugare').addEventListener('submit', async (e) => {
            e.preventDefault(); // Oprim reîncărcarea paginii

            // Colectăm datele din formular
            const serviciuNou = {
                nume: document.getElementById('nume').value,
                descriere: document.getElementById('descriere').value,
                pret: document.getElementById('pret').value,
                categorie: document.getElementById('categorie').value,
                tip_achizitie: document.getElementById('tip_achizitie').value,
                durata_minute: document.getElementById('durata_minute').value || null,
                zile_valabilitate: document.getElementById('zile_valabilitate').value || null
            };

            try {
                const response = await fetch('http://localhost:3000/api/servicii', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(serviciuNou)
                });

                if (response.ok) {
                    alert('Serviciu salvat cu succes!');
                    document.getElementById('form-adaugare').reset(); // Golește căsuțele
                    incarcaServicii(); // Reface tabelul
                }
            } catch (eroare) {
                console.error('Eroare la salvare:', eroare);
            }
        });

        // 3. FUNCȚIA DE ȘTERGERE (DELETE)
        async function stergeServiciu(id) {
            if (confirm('Ești sigur că vrei să ștergi acest serviciu?')) {
                try {
                    const response = await fetch(`http://localhost:3000/api/servicii/${id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        incarcaServicii(); // Reface tabelul (dispariția rândului)
                    }
                } catch (eroare) {
                    console.error('Eroare la ștergere:', eroare);
                }
            }
        }
    </script>
</body>
</html>
